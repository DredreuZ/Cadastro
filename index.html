<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<link rel="manifest" href="manifest.json">
<title>Retirada de Estoque</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#202124}
header{background:#1565c0;color:#fff;padding:16px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:20px}
main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 8px #0001}
button,input{font:inherit}button{border:0;border-radius:10px;padding:12px 15px;cursor:pointer;font-weight:700}
.primary{background:#1565c0;color:#fff}.secondary{background:#e8eef7;color:#174a83}.danger{background:#d93025;color:#fff}.success{background:#188038;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.field{margin:8px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}.field input{width:100%;padding:11px;border:1px solid #ccd2d8;border-radius:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:140px}
#reader{width:100%;max-width:500px;margin:auto;border-radius:12px;overflow:hidden;background:#111}
#scanner{display:none}.hint{text-align:center;color:#666;font-size:13px;margin:8px}
.product{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}
.product img{width:65px;height:65px;object-fit:contain;border-radius:8px;background:#f1f1f1}.product small{color:#666}.qty{font-size:18px;font-weight:700}
#modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:18px}
.modalbox{background:#fff;border-radius:18px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto}.modalbox img{display:block;width:120px;height:120px;object-fit:contain;margin:8px auto;border-radius:12px;background:#f3f3f3}
.total{font-size:18px;font-weight:700}.muted{color:#6b7280}.empty{text-align:center;color:#777;padding:20px}
nav{display:flex;gap:7px;overflow:auto;margin-bottom:8px}nav button{white-space:nowrap}
.hidden{display:none!important}
@media(max-width:500px){main{padding:9px}.product{grid-template-columns:58px 1fr auto}.product img{width:55px;height:55px}}
</style>
</head>
<body>
<header><h1>📦 Retirada de Estoque</h1></header>
<main>
<nav>
<button class="primary" onclick="showTab('retirada')">Nova retirada</button>
<button class="secondary" onclick="showTab('historico')">Histórico</button>
<button class="secondary" onclick="showTab('produtos')">Produtos</button>
</nav>

<section id="retirada">
<div class="card">
<div class="actions">
<button class="primary" onclick="startScanner()">📷 Ler código</button>
<button class="secondary" onclick="manualCode()">⌨️ Digitar código</button>
</div>
<div id="scanner" class="card">
<div id="reader"></div>
<p class="hint">Aponte a câmera traseira para o código de barras.</p>
<button class="danger" onclick="stopScanner()">Fechar câmera</button>
</div>
</div>

<div class="card">
<h3>Produto</h3>
<div class="row">
<div class="field"><label>Código</label><input id="code" inputmode="numeric" placeholder="EAN/GTIN"></div>
<div class="field"><label>Quantidade</label><input id="qty" type="number" min="1" value="1"></div>
</div>
<div class="field"><label>Nome</label><input id="name" placeholder="Nome do produto"></div>
<div class="field"><label>Imagem (URL opcional)</label><input id="image" placeholder="https://..."></div>
<div class="actions"><button class="success" onclick="addProduct()">➕ Adicionar à retirada</button></div>
</div>

<div class="card">
<h3>Itens da retirada</h3>
<div id="items"></div>
<div class="total" id="totals"></div>
<div class="actions" style="margin-top:12px">
<button class="primary" onclick="saveAndExport('pdf')">📄 PDF com imagens</button>
<button class="secondary" onclick="exportCSV()">📊 Tabela CSV</button>
<button class="secondary" onclick="exportTXT()">📝 TXT</button>
<button class="success" onclick="finishRetirada()">💾 Salvar retirada</button>
<button class="danger" onclick="clearCurrent()">🗑️ Limpar</button>
</div>
</div>
</section>

<section id="historico" class="hidden">
<div class="card"><h3>Histórico de retiradas</h3><div id="history"></div></div>
</section>

<section id="produtos" class="hidden">
<div class="card"><h3>Produtos conhecidos</h3><div id="known"></div></div>
</section>
</main>

<div id="modal">
<div class="modalbox">
<h2>Confirme o código</h2>
<div id="modalContent"></div>
<div class="actions">
<button class="success" onclick="confirmScan(true)">✓ SIM, está correto</button>
<button class="danger" onclick="confirmScan(false)">✕ NÃO</button>
</div>
</div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let items=JSON.parse(localStorage.getItem('currentItems')||'[]');
let history=JSON.parse(localStorage.getItem('stockHistory')||'[]');
let known=JSON.parse(localStorage.getItem('knownProducts')||'{}');
let scanner=null, pending=null;

function save(){localStorage.setItem('currentItems',JSON.stringify(items));localStorage.setItem('stockHistory',JSON.stringify(history));localStorage.setItem('knownProducts',JSON.stringify(known));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showTab(t){['retirada','historico','produtos'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==t));renderHistory();renderKnown();}
function render(){
 const box=document.getElementById('items');
 if(!items.length){box.innerHTML='<div class="empty">Nenhum produto adicionado.</div>';document.getElementById('totals').textContent='';return}
 box.innerHTML=items.map((p,i)=>`<div class="product"><img src="${esc(p.image||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2265%22 height=%2265%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23eee%22/%3E%3C/svg%3E')}" onerror="this.style.visibility='hidden'"><div><b>${esc(p.name||'Produto sem nome')}</b><br><small>${esc(p.code)}</small></div><div class="qty">${p.qty}<br><button class="danger" onclick="removeItem(${i})">×</button></div></div>`).join('');
 document.getElementById('totals').textContent=`Total de unidades: ${items.reduce((a,p)=>a+Number(p.qty),0)} • Produtos: ${items.length}`;
}
function removeItem(i){items.splice(i,1);save();render()}
async function lookup(code){
 if(known[code]) return known[code];
 try{
  const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json');
  const d=await r.json();
  if(d.status===1){
   const p=d.product||{};
   return {code,name:p.product_name_pt||p.product_name||p.generic_name||'',image:p.image_front_url||p.image_url||''};
  }
 }catch(e){}
 return {code,name:'',image:''};
}
async function processCode(code){
 code=String(code||'').replace(/\s/g,'');
 if(!code)return;
 pending=await lookup(code);
 showConfirm(pending);
}
function showConfirm(p){
 document.getElementById('modalContent').innerHTML=p.name?
 `<img src="${esc(p.image||'')}" onerror="this.style.display='none'"><p><b>${esc(p.name)}</b></p><p>Código: <b>${esc(p.code)}</b></p><p>Encontramos uma possível correspondência na internet.</p>`:
 `<p><b>${esc(p.code)}</b></p><p class="muted">Não encontramos o produto automaticamente. Você poderá preencher o nome e a imagem depois.</p>`;
 document.getElementById('modal').style.display='flex';
}
function confirmScan(ok){
 document.getElementById('modal').style.display='none';
 if(ok){fillForm(pending);stopScanner()}
 else{pending=null; if(document.getElementById('scanner').style.display!=='none') startScanner()}
}
function fillForm(p){document.getElementById('code').value=p.code;document.getElementById('name').value=p.name||'';document.getElementById('image').value=p.image||'';document.getElementById('qty').value=1}
function addProduct(){
 const code=document.getElementById('code').value.trim(); if(!code){alert('Informe o código.');return}
 const p={code,name:document.getElementById('name').value.trim()||'Produto sem nome',image:document.getElementById('image').value.trim(),qty:Math.max(1,Number(document.getElementById('qty').value)||1)};
 const old=items.find(x=>x.code===code);
 if(old) old.qty+=p.qty; else items.push(p);
 known[code]={code:p.code,name:p.name,image:p.image}; save(); render();
 document.getElementById('code').value='';document.getElementById('name').value='';document.getElementById('image').value='';document.getElementById('qty').value=1;
}
function manualCode(){const c=prompt('Digite o código de barras:');if(c)processCode(c)}
async function startScanner(){
 if(scanner){return}
 document.getElementById('scanner').style.display='block';
 scanner=new Html5Qrcode("reader");
 try{
  await scanner.start({facingMode:{exact:"environment"}},{fps:10,qrbox:{width:280,height:120}},code=>{scanner.pause(true);processCode(code)},()=>{});
 }catch(e){
  try{await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:280,height:120}},code=>{scanner.pause(true);processCode(code)},()=>{})}
  catch(err){alert('Não foi possível abrir a câmera. Verifique a permissão do navegador.');scanner=null;document.getElementById('scanner').style.display='none'}
 }
}
async function stopScanner(){
 if(scanner){try{await scanner.stop();}catch(e){}try{scanner.clear()}catch(e){}scanner=null}
 document.getElementById('scanner').style.display='none';
}
function finishRetirada(){
 if(!items.length){alert('Adicione pelo menos um produto.');return}
 const rec={id:Date.now(),date:new Date().toLocaleString('pt-BR'),items:JSON.parse(JSON.stringify(items))};
 history.unshift(rec);items=[];save();render();alert('Retirada salva no histórico.');showTab('historico');
}
function clearCurrent(){if(confirm('Limpar todos os itens da retirada atual?')){items=[];save();render()}}
function renderHistory(){
 const el=document.getElementById('history');
 if(!history.length){el.innerHTML='<div class="empty">Nenhuma retirada salva.</div>';return}
 el.innerHTML=history.map((r,i)=>`<div class="card"><b>Retirada #${String(r.id).slice(-6)}</b><br><small>${esc(r.date)}</small><br>${r.items.length} produtos • ${r.items.reduce((a,p)=>a+Number(p.qty),0)} unidades<br><div class="actions" style="margin-top:8px"><button class="primary" onclick="exportRecordPDF(${i})">PDF</button><button class="secondary" onclick="exportRecordTXT(${i})">TXT</button><button class="danger" onclick="deleteHistory(${i})">Excluir</button></div></div>`).join('');
}
function renderKnown(){
 const el=document.getElementById('known');let arr=Object.values(known);
 el.innerHTML=arr.length?arr.map(p=>`<div class="product"><img src="${esc(p.image||'')}" onerror="this.style.visibility='hidden'"><div><b>${esc(p.name||'Sem nome')}</b><br><small>${esc(p.code)}</small></div></div>`).join(''):'<div class="empty">Nenhum produto conhecido.</div>';
}
function deleteHistory(i){if(confirm('Excluir esta retirada?')){history.splice(i,1);save();renderHistory()}}
function txtFor(arr,date){
 let s='RETIRADA DE ESTOQUE\\nData: '+date+'\\n\\n';
 arr.forEach((p,i)=>s+=String(i+1).padStart(2,'0')+' - '+p.name+'\\nCódigo: '+p.code+'\\nQuantidade: '+p.qty+'\\n\\n');
 s+='TOTAL DE UNIDADES: '+arr.reduce((a,p)=>a+Number(p.qty),0)+'\\nPRODUTOS: '+arr.length+'\\n';return s;
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportTXT(){download(new Blob([txtFor(items,new Date().toLocaleString('pt-BR'))],{type:'text/plain;charset=utf-8'}),'retirada.txt')}
function exportRecordTXT(i){const r=history[i];download(new Blob([txtFor(r.items,r.date)],{type:'text/plain;charset=utf-8'}),'retirada-'+r.id+'.txt')}
function exportCSV(){let s='Código;Produto;Quantidade;Imagem\\n'+items.map(p=>`"${p.code}";"${p.name.replace(/"/g,'""')}";${p.qty};"${p.image||''}"`).join('\\n');download(new Blob(['\\ufeff'+s],{type:'text/csv;charset=utf-8'}),'retirada.csv')}
function pdfLib(){return new Promise((resolve,reject)=>{if(window.jspdf)return resolve();let s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
async function makePDF(arr,date,file){
 try{await pdfLib();const {jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFontSize(16);doc.text('RETIRADA DE ESTOQUE',14,18);doc.setFontSize(10);doc.text('Data: '+date,14,26);let y=38;
 for(const p of arr){if(y>265){doc.addPage();y=18} if(p.image){try{const im=await toDataURL(p.image);doc.addImage(im,'JPEG',14,y-6,18,18)}catch(e){}}
  doc.setFontSize(10);doc.text((p.name||'Produto').slice(0,45),36,y);doc.text('Código: '+p.code,36,y+6);doc.text('Quantidade: '+p.qty,36,y+12);y+=27}
 doc.text('Total de unidades: '+arr.reduce((a,p)=>a+Number(p.qty),0),14,y);doc.save(file)}
 catch(e){alert('Não foi possível gerar o PDF. Tente novamente.')}
}
function toDataURL(url){return fetch(url).then(r=>r.blob()).then(b=>new Promise((res,rej)=>{let rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(b)}))}
function saveAndExport(type){if(!items.length){alert('Adicione produtos.');return}makePDF(items,new Date().toLocaleString('pt-BR'),'retirada.pdf')}
function exportRecordPDF(i){const r=history[i];makePDF(r.items,r.date,'retirada-'+r.id+'.pdf')}
render();renderHistory();renderKnown();
</script>
</body>
</html>
